[project]
name = "base-python-project"
version = "0.1.0"
description = ""
authors = [{name="Diogo Santos Martins", email="yogaxpto@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/yogaxpto/base-python-project"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "pytest-cov>=6.1.1",
]

[tool.uv.pip]
system = true


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.coverage.run]
omit = [
  "*/tests/*"
]

[tool.coverage.report]
omit = [
  "*/tests/*"
]

[tool.mypy]
strict = true
show_error_codes = true
warn_unused_configs = true
pretty = true
