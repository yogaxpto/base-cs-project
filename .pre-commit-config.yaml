repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^(\.devcontainer/devcontainer\.json|\.vscode/.*\.json)$ # JSONC files

  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format
        entry: dotnet format BaseCsProject.slnx --include
        language: system
        types: [c#]
