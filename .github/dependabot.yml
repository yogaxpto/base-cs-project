# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - "yogaxpto"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    assignees:
      - "yogaxpto"
  - package-ecosystem: "github-actions"
    directories:
      - "/.github/actions/*"
    schedule:
      interval: weekly
    assignees:
      - "yogaxpto"
  # NuGet is handled by Renovate (.github/renovate.json), not Dependabot:
  # Dependabot's NuGet updater regenerates packages.lock.json for a single
  # target framework, dropping the other <TargetFrameworks> sections, which
  # fails CI's locked-mode restore (dependabot/dependabot-core#13474).
  # Renovate runs `dotnet restore --force-evaluate`, which keeps them all.